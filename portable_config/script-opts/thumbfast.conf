# =========================================================
#  thumbfast.conf — превью-кадры при наведении на таймлайн
#  Работает для локальных файлов, YouTube, VK Видео и RuTube.
#  Сетевые HLS/DASH-потоки включены явно (network=yes).
# =========================================================
network=yes
# Универсальное аппаратное декодирование для фонового нарезчика:
# NVDEC на NVIDIA, D3D11VA/DXVA2 на AMD, QuickSync/D3D11VA на Intel.
# auto-safe безопасно откатывается на CPU для неподдерживаемых кодеков.
hwdec=auto-safe
direct_io=yes
max_height=140
max_width=250
spawn_first=yes
# Фоновый mpv-нарезчик полностью закрывается через 60 с без запросов превью.
# Пока смотрим серию и водим мышью по таймлайну, он живёт и отдаёт кадры
# мгновенно; в паузе/простое освобождает видеопамять (сразу после закрытия
# VRAM возвращается основному окну — шейдерам 4K). Новый кадр после простоя
# поднимает процесс автоматически (thumbfast.lua, spawn()).
quit_after_inactivity=60
# precise=0 — ключевой параметр для онлайна: прыгать сразу по ключевым кадрам
# (миллисекунды), а не декодировать десятки секунд ради точного кадра.
# Иначе превью зависает на одном кадре и не успевает обновляться.
precise=0
# Превью только для видео длиннее 5 секунд (короткие ролики не превьюим).
min_duration=5
# thumbfast запускает фоновый mpv для генерации кадров.
# Кроссплатформенное значение "mpv":
#   • Windows — thumbfast.lua сам подставляет mpv.exe рядом с portable_config
#     (или путь запущенного процесса), а если не нашёл — ищет в PATH;
#   • Linux / macOS — используется системный mpv из PATH либо локальный
#     бинарник в корне проекта (thumbfast.lua проверяет его первым).
# Жёстких путей вида C:\... больше нет: папку можно переносить и
# запускать сборку на любой ОС.
mpv_path=mpv
