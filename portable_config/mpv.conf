# =========================================================
#  mpv.conf — универсальный 4K realtime profile
#  Windows: DirectX 11 / Vulkan (NVIDIA, AMD, Intel)
#  Linux:   Vulkan / OpenGL / VAAPI / NVDEC
#  macOS:   Metal / VideoToolbox
#  Портативная сборка: конфиг лежит рядом с mpv.
# =========================================================

# --- Базовое качество рендера ---
# vo=gpu-next — современный рендерер libplacebo для всех вендоров.
profile=gpu-hq
vo=gpu-next
# auto: mpv сам выбирает рабочий API под ОС, драйвер и видеокарту:
# Windows — DirectX 11 или Vulkan, Linux — Vulkan/OpenGL,
# macOS — Metal. Принудительно ничего не привязываем.
gpu-api=auto

# --- Аппаратное декодирование (универсальное) ---
# auto-safe автоматически задействует NVDEC (NVIDIA), D3D11VA/DXVA2
# (AMD/Intel на Windows), VAAPI/VDPAU (Linux), VideoToolbox (macOS),
# а если кодек/старая карта его не поддерживает — безопасно
# откатывается на процессор. Конфиг не привязан к одной видеокарте.
hwdec=auto-safe

# --- Синхронизация звука и видео при сетевых скачках ---
# Звук — ведущий: картинка подстраивается, звук не рвётся и не пропадает.
video-sync=audio
# При перегрузке GPU/сети роняем кадры видео, а не звук (без рассинхрона).
framedrop=vo
# Мягко «подтягивать» расхождение A/V до 30 секунд, вместо резких скачков.
autosync=30

# --- Кэш скомпилированных GLSL-шейдеров (мгновенный запуск) ---
# Anime4K/FSRCNNX компилируются в GPU-программы несколько секунд при каждом
# старте. Дисковый кэш сохраняет готовые бинарники: повторный запуск любого
# режима — без «чёрного кадра» и ожидания компиляции.
gpu-shader-cache=yes
gpu-shader-cache-dir=~~/shader_cache

# --- Многопоточность декодирования и задержка вывода ---
# 4 потока lavc: достаточно для 4K HEVC/AVC, не отбирая ядра у UI-скрипта.
vd-lavc-threads=4
# Снижает задержку вывода кадров; качество картинки не меняется.
video-latency-hacks=yes

# --- Масштабирование (лума / хрома / даунскейл) ---
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# --- Дебандинг (градиенты, небо, тёмные сцены) ---
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

# --- OSD ---
osd-font-size=24
# Уведомления (в т.ч. смена шейдеров) — ровно 2 секунды
osd-duration=2000
# Свой прогресс-бар и время — встроенные сообщения о перемотке не нужны
osd-on-seek=no
# Сообщения mpv (режимы шейдеров и т.п.) показываем ниже шапки нашего интерфейса
osd-align-y=top
osd-margin-y=96

# --- Курсор мыши ---
# Прячется вместе с интерфейсом; скрипт yummy_ui.lua дополнительно
# синхронизирует его с таймером панелей (2.5 с бездействия).
cursor-autohide=2000
# Прятать курсор и в оконном режиме, а не только в полноэкранном
cursor-autohide-fs-only=no

# --- Кастомный интерфейс (portable_config/scripts/yummy_ui.lua) ---
# Встроенный OSC отключён: рисуем свой плеер (шапка, серии, прогресс-бар, меню).
osc=no
osd-bar=no
border=yes
# Автоплейлист: подхватывать соседние серии из той же папки
autocreate-playlist=same

# --- Шейдеры по умолчанию: Anime4K Mode A (HQ) ---
# Цепочка из официального пресета Anime4K v4.0.1 (High-End GPU).
# Переключение режимов — CTRL+1..5, полное отключение — CTRL+0.
# CTRL+5 (Старое кино · Реставрация) дополнительно включает vf hqdn3d.
# На встроенных/слабых GPU лаунчер и yummy_ui.lua автоматически
# подставляют быстрые версии _M/_S вместо _VL (см. gpu_profile.txt).
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
# Видеофильтры по умолчанию отключены; hqdn3d включает только режим реставрации.
vf=

# =========================================================
#  Онлайн-просмотр (yt-dlp) — буферизация сетевых потоков
# =========================================================

# Включить сетевой кэш
cache=yes

# Пауза при исчерпании кэша (сетевой обрыв) — вместо рывков и рассинхрона
cache-pause=yes
# Не начинать воспроизведение, пока не набрано cache-pause-wait секунд
cache-pause-initial=yes
cache-pause-wait=2

# Буфер вперёд: 800 МБ — сглаживает просадки скорости CDN/провайдера
demuxer-max-bytes=800M

# Буфер назад: 150 МБ — позволяет перематывать назад без повторной загрузки
demuxer-max-back-bytes=150M

# Читать вперёд 30 секунд потока — глубже буфер при скачках сети
demuxer-readahead-secs=30

# Автопереподключение при обрыве сегментов HLS/DASH (YouTube, VK, RuTube)
stream-lavf-o-append=reconnect=1
stream-lavf-o-append=reconnect_streamed=1
stream-lavf-o-append=reconnect_delay_max=5

# Максимальное качество для апскейлинга шейдерами (1080p -> 4K)
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# Онлайн-режим: YouTube, VK Видео (vk.com / vkvideo.ru), RuTube (rutube.ru)
# Метаданные, HLS/DASH-потоки и главы (chapter-list) забирает yt-dlp.
ytdl=yes

# Путь к yt-dlp: по умолчанию mpv ищет `yt-dlp` в PATH, а на Windows —
# рядом с mpv (в том числе yt-dlp.exe). Лаунчер дополнительно передаёт
# точный путь через --script-opts-append, поэтому здесь жёсткого пути нет
# и конфиг одинаково работает на Windows, Linux и macOS.
# try_ytdl_first: сначала спросить yt-dlp — так корректно подхватываются
# главы/таймкоды из описания и структуры ролика.
script-opts=ytdl_hook-try_ytdl_first=yes

# Аргументы yt-dlp: авто-субтитры (ru/en) + обход «unavailable videos».
# ВАЖНО: mpv разделяет значения ytdl-raw-options запятыми, поэтому список
# языков задан одним regex "(ru|en).*" вместо "ru.*,en.*" — иначе mpv
# разорвал бы аргумент и сломал вызов yt-dlp. Результат тот же.
ytdl-raw-options=write-auto-subs=,sub-langs=(ru|en).*,compat-options=no-youtube-unavailable-videos

# Запоминать место остановки и продолжать с него при следующем запуске
save-position-on-quit=yes

# Сертификаты: экспорт из хранилища Windows нужен только на Windows.
# Авто-профиль применяется при старте, если platform == "windows";
# на Linux/macOS mpv использует системное хранилище CA и файл не трогает.
[windows-ca]
profile-cond=platform=="windows"
profile-restore=copy
tls-ca-file=~~/ca-bundle.crt

# Возврат к глобальным опциям: всё, что ниже, действует на всех ОС.
# (В mpv.conf опции после [профиля] принадлежат этому профилю, поэтому
# без [default] настройки субтитров применялись бы только на Windows.)
[default]

# =========================================================
#  Субтитры — у самого низа, аккуратный шрифт,
#  тёмная полупрозрачная плашка в палитре интерфейса
# =========================================================
sub-pos=96
# Базовый шрифт — системный sans-serif (Linux/macOS). На Windows
# авто-профиль ниже подставляет привычный Segoe UI.
sub-font='sans-serif'
sub-font-size=46
sub-color='#f4f4f5'
sub-back-color='#B8141416'
sub-border-style=background-box
sub-border-size=7
sub-shadow-offset=0
sub-bold=no
# Единый вид и для ASS-дорожек (иначе позиция/шрифт задаются самим файлом)
sub-ass-override=force

# =========================================================
#  Шрифт субтитров по платформам
#  Windows — привычный Segoe UI; Linux/macOS — системный
#  sans-serif (DejaVu Sans, Helvetica Neue). Профиль стоит
#  в конце файла, чтобы не перехватывать опции выше.
# =========================================================
[windows-sub-font]
profile-cond=platform=="windows"
profile-restore=copy
sub-font='Segoe UI'
