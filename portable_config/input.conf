# =========================================================
#  input.conf — переключение шейдеров на лету
#  Логика: сброс текущих шейдеров -> установка набора -> OSD
# =========================================================

# Общее правило: при смене режима сначала принудительно очищается vf,
# чтобы фильтр hqdn3d не оставался висеть на современных видео.

# Anime4K Mode A (HQ на мощных GPU / Fast на встроенных) — максимальное
# качество для большинства 1080p аниме. yummy_ui сам подбирает _VL или _M/_S
# по классу видеокарты (см. gpu_profile.txt), горячая клавиша не меняется.
CTRL+1 script-message-to yummy_ui shader-mode 1

# Anime4K Mode B — мягкий восстановитель, для аниме низкого качества / 720p
CTRL+2 script-message-to yummy_ui shader-mode 2

# Anime4K Mode C — апскейл с шумоподавлением, для сильно зашумлённых источников
CTRL+3 script-message-to yummy_ui shader-mode 3

# FSRCNNX — нейросетевой апскейл x2 для фильмов и сериалов (live action)
CTRL+4 script-message-to yummy_ui shader-mode 4

# Старое кино / Сериалы 4K (Реставрация) — DVD-рипы, VHS-оцифровки, зерно и сжатие.
# Мягкий hqdn3d + денойз Anime4K + нейросетевой апскейл FSRCNNX.
CTRL+5 script-message-to yummy_ui shader-mode 5

# Полное отключение шейдеров — чистый оригинал (0 = последний режим в списке)
CTRL+0 script-message-to yummy_ui shader-mode 0

# =========================================================
#  Главы / эпизоды (таймкоды YouTube, VK Видео, RuTube)
# =========================================================
# Быстрое переключение эпизодов — стандартные команды mpv
PGUP add chapter 1
PGDWN add chapter -1

# =========================================================
#  Субтитры: уведомление на 2.5 секунды (левый верхний угол)
# =========================================================
# v — включить/выключить субтитры (как кнопка CC в интерфейсе)
v script-message-to yummy_ui subs-toggle
# j — переключить следующую дорожку субтитров
j script-message-to yummy_ui subs-cycle

# =========================================================
#  Звук: режимы улучшения (раздел «ЗВУК» в настройках)
# =========================================================
# ALT+5 — Оригинал (без обработки)
ALT+5 script-message-to yummy_ui sound-mode 1 ; show-text "Звук: Оригинал" 2000
# ALT+6 — Четкий голос (приглушение фона)
ALT+6 script-message-to yummy_ui sound-mode 2 ; show-text "Звук: Четкий голос" 2000
# ALT+7 — Улучшение плохого звука
ALT+7 script-message-to yummy_ui sound-mode 3 ; show-text "Звук: Улучшение плохого звука" 2000
# ALT+8 — Кинотеатр / объемный звук
ALT+8 script-message-to yummy_ui sound-mode 4 ; show-text "Звук: Кинотеатр / Объемный" 2000

# Дублирующие сочетания ALT+1..4 (те же четыре режима, удобно на ноутбуках,
# где верхний ряд F-клавиш занят). Существующие ALT+5..8 продолжают работать.
ALT+1 script-message-to yummy_ui sound-mode 1 ; show-text "Звук: Оригинал" 2000
ALT+2 script-message-to yummy_ui sound-mode 2 ; show-text "Звук: Четкий голос" 2000
ALT+3 script-message-to yummy_ui sound-mode 3 ; show-text "Звук: Улучшение плохого звука" 2000
ALT+4 script-message-to yummy_ui sound-mode 4 ; show-text "Звук: Кинотеатр / Объемный" 2000
